<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>婴儿取名工作台</title>
<style>
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: #f4f7f6;
  color: #22302d;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  line-height: 1.5;
}
button, input, select { font: inherit; }
.app { max-width: 1200px; margin: 0 auto; padding: 24px 20px 56px; }
.topbar {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  align-items: flex-end;
  justify-content: space-between;
  border-bottom: 1px solid #d8e2df;
  padding-bottom: 18px;
  margin-bottom: 18px;
}
h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 0; }
.subtitle { margin: 6px 0 0; color: #5d716c; font-size: 13px; }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
.field { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: #40534e; }
.field input[type="text"], .field select {
  min-height: 36px;
  border: 1px solid #c9d6d2;
  border-radius: 6px;
  padding: 0 10px;
  background: #fff;
  color: #22302d;
}
.field input[type="text"] { width: 92px; }
.check {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  font-size: 13px;
  color: #40534e;
  cursor: pointer;
}
.summary {
  display: grid;
  grid-template-columns: auto auto 1fr;
  gap: 12px;
  align-items: stretch;
  margin-bottom: 18px;
}
.stat {
  background: #fff;
  border: 1px solid #d8e2df;
  border-radius: 8px;
  padding: 10px 16px;
  min-width: 112px;
}
.stat span { display: block; font-size: 24px; font-weight: 600; color: #0f766e; }
.stat small { display: block; margin-top: 2px; color: #5d716c; font-size: 12px; }
.fullname {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #fff;
  border: 1px solid #d8e2df;
  border-radius: 8px;
  padding: 10px 16px;
  min-height: 64px;
  font-size: 14px;
  color: #40534e;
  min-width: 0;
}
.fullname strong {
  font-size: 26px;
  font-weight: 600;
  color: #0f766e;
  overflow-wrap: anywhere;
}
.fullname-main { min-width: 0; }
.fullname-main span { display: block; color: #5d716c; font-size: 12px; }
.fullname-meta { margin-left: auto; text-align: right; color: #5d716c; font-size: 13px; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 14px;
}
.card {
  display: flex;
  flex-direction: column;
  gap: 12px;
  min-width: 0;
  background: #fff;
  border: 1px solid #d8e2df;
  border-radius: 8px;
  padding: 16px;
}
.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.name { font-size: 26px; font-weight: 600; letter-spacing: 2px; overflow-wrap: anywhere; }
.pinyin { margin-top: 4px; color: #5d716c; font-size: 13px; }
.tone { margin-top: 2px; color: #7b8b86; font-size: 12px; }
.badge {
  flex: 0 0 auto;
  border: 1px solid #cbd9d5;
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 12px;
  color: #40534e;
  white-space: nowrap;
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  background: #edf4f1;
  color: #2f6b5d;
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 12px;
}
.origin { color: #40534e; font-size: 13px; line-height: 1.55; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; }
.score {
  display: grid;
  grid-template-columns: 22px 1fr 18px;
  gap: 6px;
  align-items: center;
  font-size: 12px;
  color: #40534e;
}
.bar { height: 6px; background: #e8efec; border-radius: 999px; overflow: hidden; }
.fill { height: 100%; background: #0f766e; border-radius: 999px; }
.note {
  border-top: 1px dashed #d8e2df;
  padding-top: 10px;
  font-size: 12px;
  color: #5d716c;
  line-height: 1.5;
}
.actions { display: flex; gap: 8px; margin-top: auto; }
.detail-toggle { align-self: flex-start; }
.detail {
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: #f6faf8;
  border: 1px solid #d8e2df;
  border-radius: 8px;
  padding: 12px;
}
.detail[hidden] { display: none; }
.fit-row { display: flex; align-items: center; gap: 8px; }
.fit-badge {
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 12px;
}
.fit-high { background: #dff3ea; color: #146c54; }
.fit-mid { background: #eef4f1; color: #2f6b5d; }
.fit-low { background: #fdeeea; color: #a34a36; }
.detail p { margin: 0; font-size: 12px; color: #40534e; line-height: 1.6; }
.detail strong { color: #22302d; font-weight: 500; }
button {
  min-height: 34px;
  border: 1px solid #c9d6d2;
  border-radius: 6px;
  padding: 0 12px;
  background: #fff;
  color: #22302d;
  cursor: pointer;
}
button.is-picked {
  background: #0f766e;
  border-color: #0f766e;
  color: #fff;
}
.picked-panel {
  margin-top: 28px;
  border-top: 1px solid #d8e2df;
  padding-top: 16px;
}
.picked-panel h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
.picked-list { display: flex; flex-wrap: wrap; gap: 8px; }
.pick-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid #c9d6d2;
  border-radius: 8px;
  background: #fff;
  padding: 5px 6px 5px 12px;
  font-size: 14px;
}
.pick-chip button { min-height: 26px; padding: 0 8px; font-size: 12px; }
.empty { padding: 24px 0; color: #5d716c; text-align: center; }
.panel-head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}
.panel-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.compare { margin-top: 18px; overflow-x: auto; }
.compare h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
.compare-table {
  width: 100%;
  min-width: 760px;
  border-collapse: collapse;
  font-size: 13px;
}
.compare-table th,
.compare-table td {
  border-bottom: 1px solid #d8e2df;
  padding: 9px 10px;
  text-align: left;
  vertical-align: top;
}
.compare-table th { color: #40534e; font-weight: 500; white-space: nowrap; }
.compare-table td:first-child { min-width: 150px; }
.compare-table .num { white-space: nowrap; }
.compare-table .pinyin { margin-top: 3px; }
.custom-panel {
  margin-top: 26px;
  border-top: 1px solid #d8e2df;
  padding-top: 16px;
}
.custom-panel h2 { margin: 0 0 12px; font-size: 16px; font-weight: 600; }
.custom-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 12px; }
.custom-result {
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #fff;
  border: 1px solid #d8e2df;
  border-radius: 8px;
  padding: 14px;
}
.diag-line { margin: 0; font-size: 13px; color: #40534e; line-height: 1.7; }
.diag-line strong { color: #22302d; font-weight: 500; }
@media (max-width: 720px) {
  .summary { grid-template-columns: 1fr 1fr; }
  .fullname { grid-column: 1 / -1; }
  .controls { width: 100%; }
}
@media (max-width: 480px) {
  .fullname { flex-direction: column; align-items: flex-start; }
  .fullname-meta { margin-left: 0; text-align: left; }
}
@media (max-width: 380px) {
  .scores { grid-template-columns: 1fr; }
  .app { padding: 18px 14px 40px; }
}
</style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div>
      <h1>取名工作台</h1>
      <p class="subtitle">音 · 义 · 形 · 文 · 俗 · 合</p>
    </div>
    <div class="controls">
      <label class="field">姓氏<input id="surname" type="text" maxlength="4" autocomplete="off"></label>
      <label class="field">屏蔽字<input id="blocked" type="text" maxlength="12" autocomplete="off"></label>
      <label class="field">性别
        <select id="gender">
          <option value="all">不限</option>
          <option value="男">男</option>
          <option value="女">女</option>
          <option value="中性">中性</option>
        </select>
      </label>
      <label class="field">风格
        <select id="style">
          <option value="all">不限</option>
          <option value="文雅">文雅</option>
          <option value="大气">大气</option>
          <option value="自然">自然</option>
          <option value="现代">现代</option>
          <option value="古典">古典</option>
          <option value="温柔">温柔</option>
          <option value="稳重">稳重</option>
          <option value="清新">清新</option>
          <option value="书卷">书卷</option>
        </select>
      </label>
      <label class="check"><input id="folk" type="checkbox">马年友好</label>
      <label class="check"><input id="rec" type="checkbox">本命推荐</label>
      <label class="check"><input id="fitOnly" type="checkbox">八字优先</label>
      <label class="field">排序
        <select id="sort">
          <option value="fit" selected>八字契合</option>
          <option value="total">综合分</option>
          <option value="yin">音韵分</option>
          <option value="su">重名友好</option>
        </select>
      </label>
    </div>
  </header>

  <section class="summary" aria-label="概览">
    <div class="stat"><span id="count">116</span><small>候选</small></div>
    <div class="stat"><span id="pickedCount">0</span><small>已选</small></div>
    <div class="fullname">
      <div class="fullname-main"><span>全名</span><strong id="fullnameText">—</strong></div>
      <div class="fullname-meta" id="fullnameMeta">—</div>
    </div>
  </section>

  <section class="custom-panel" aria-label="自拟名字诊断">
    <h2>自拟名字诊断</h2>
    <div class="custom-controls">
      <label class="field">自拟名<input id="customName" type="text" maxlength="4" autocomplete="off"></label>
    </div>
    <div class="custom-result" id="customResult">
      <div class="empty">输入名字后显示诊断</div>
    </div>
  </section>

  <section class="grid" id="grid" aria-label="候选名字"></section>

  <section class="picked-panel">
    <div class="panel-head">
      <h2>候选清单</h2>
      <button id="copyCompare" type="button">复制对比</button>
    </div>
    <div class="picked-list" id="pickedList"></div>
    <div class="compare" id="compareBox" hidden>
      <h3>最终对比</h3>
      <table class="compare-table" aria-label="最终候选对比">
        <thead>
          <tr>
            <th>名字</th>
            <th>出处</th>
            <th>声调</th>
            <th>六维评分</th>
            <th>注意</th>
          </tr>
        </thead>
        <tbody id="compareTableBody"></tbody>
      </table>
    </div>
  </section>
</main>

<script>
const SCORE_NAMES = ["音", "义", "形", "文", "俗", "合"];
const NAMES = [
  { n: "其琛", g: "男", py: "qí chēn", src: "《诗经·鲁颂·泮水》· 来献其琛", tags: ["古典", "书卷", "稳重"], sc: [5, 5, 4, 5, 4, 4], horse: false, note: "珍宝之意；琛非高频字，需教写。" },
  { n: "聿修", g: "男", py: "yù xiū", src: "《诗经·大雅·文王》· 聿修厥德", tags: ["古典", "书卷"], sc: [4, 5, 4, 5, 4, 4], horse: false, note: "继承并修养美德；聿需教写。" },
  { n: "清越", g: "中性", py: "qīng yuè", src: "《礼记·聘义》· 其声清越以长", tags: ["文雅", "大气", "清新"], sc: [5, 5, 5, 5, 4, 4], horse: false, rec: true, note: "声音清亮悠长；易被写成清月。" },
  { n: "景行", g: "男", py: "jǐng xíng", src: "《诗经·小雅·车舝》· 景行行止", tags: ["大气", "稳重", "古典"], sc: [4, 5, 5, 5, 4, 3], horse: false, note: "第二个行读 xíng，勿读 háng。" },
  { n: "嘉树", g: "男", py: "jiā shù", src: "《楚辞·九章·橘颂》· 后皇嘉树", tags: ["自然", "稳重", "大气"], sc: [4, 5, 5, 5, 4, 4], horse: true, note: "美好之树；木字旁贴合马年民俗。" },
  { n: "既明", g: "男", py: "jì míng", src: "《诗经·大雅·烝民》· 既明且哲", tags: ["古典", "书卷"], sc: [4, 5, 5, 5, 4, 4], horse: false, note: "明智明达；偏书面，适合文雅家庭。" },
  { n: "允文", g: "男", py: "yǔn wén", src: "《诗经·鲁颂·泮水》· 允文允武", tags: ["文雅", "古典"], sc: [4, 5, 5, 5, 4, 4], horse: false, note: "文德信实；方言中注意与运文同音。" },
  { n: "承宇", g: "男", py: "chéng yǔ", src: "《楚辞·九章·涉江》· 云霏霏而承宇", tags: ["大气", "稳重"], sc: [4, 5, 5, 5, 4, 4], horse: true, note: "胸襟开阔；宀意象符合马年民俗。" },
  { n: "鹤鸣", g: "男", py: "hè míng", src: "《诗经·小雅·鹤鸣》· 鹤鸣于九皋", tags: ["大气", "古典"], sc: [4, 5, 3, 5, 4, 4], horse: false, note: "才德之声远闻；鹤笔画稍多。" },
  { n: "观复", g: "男", py: "guān fù", src: "《道德经》· 万物并作，吾以观复", tags: ["书卷", "古典", "大气"], sc: [4, 5, 5, 5, 4, 4], horse: false, note: "观察循环往复；观为多音字。" },
  { n: "含章", g: "中性", py: "hán zhāng", src: "《周易·坤卦》· 含章可贞", tags: ["文雅", "书卷", "古典"], sc: [4, 5, 5, 5, 4, 4], horse: false, note: "内蕴美质；男女皆可。" },
  { n: "知衡", g: "男", py: "zhī héng", src: "知 + 衡：求知与平衡", tags: ["现代", "稳重"], sc: [4, 4, 5, 3, 5, 4], horse: false, note: "意思清楚；无单一经典出处。" },
  { n: "婉清", g: "女", py: "wǎn qīng", src: "《诗经·郑风·野有蔓草》· 清扬婉兮", tags: ["文雅", "温柔", "古典"], sc: [5, 5, 5, 5, 2, 4], horse: false, note: "温婉清雅；近年重名偏多。" },
  { n: "望舒", g: "女", py: "wàng shū", src: "《楚辞·离骚》· 前望舒使先驱兮", tags: ["文雅", "大气", "古典"], sc: [5, 5, 5, 5, 4, 4], horse: false, note: "月御之神；古典而不难懂。" },
  { n: "云岫", g: "女", py: "yún xiù", src: "陶渊明《归去来兮辞》· 云无心以出岫", tags: ["自然", "清新", "古典"], sc: [5, 5, 3, 5, 5, 4], horse: false, note: "闲云出山；岫需教写。" },

  { n: "一苇", g: "中性", py: "yī wéi", src: "《诗经·卫风·河广》· 一苇杭之", tags: ["自然", "现代", "文雅"], sc: [5, 4, 5, 5, 4, 4], horse: false, note: "以轻捷渡江；意象偏轻盈。" },

function esc(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

const TONE_MAP = {
  "ā": 1, "á": 2, "ǎ": 3, "à": 4,
  "ē": 1, "é": 2, "ě": 3, "è": 4,
  "ī": 1, "í": 2, "ǐ": 3, "ì": 4,
  "ō": 1, "ó": 2, "ǒ": 3, "ò": 4,
  "ū": 1, "ú": 2, "ǔ": 3, "ù": 4,
  "ǖ": 1, "ǘ": 2, "ǚ": 3, "ǜ": 4
};

function toneOf(pyWord) {
  for (const ch of pyWord) {
    if (TONE_MAP[ch] !== undefined) return TONE_MAP[ch];
  }
  return 0;
}

function pinyinParts(pyStr) {
  return pyStr.trim().split(/\s+/).map(w => w.trim()).filter(Boolean);
}

function tonesFor(pyStr) {
  return pinyinParts(pyStr).map(toneOf);
}

function surnameInfo(surname) {
  if (!surname) return null;
  if (surname.length >= 2 && COMPOUND_SURNAMES[surname]) {
    return { py: COMPOUND_SURNAMES[surname] };
  }
  if (surname.length === 1 && SURNAMES[surname]) {
    return { py: SURNAMES[surname] };
  }
  return null;
}

function fullNameMeta(surname, n) {
  const sInfo = surnameInfo(surname);
  if (surname && !sInfo) return null;
  const nameTones = tonesFor(n.py);
  const tones = sInfo ? [...tonesFor(sInfo.py), ...nameTones] : nameTones;
  const nonZero = tones.filter(t => t !== 0);
  const unique = new Set(nonZero).size;
  let hint = "";
  if (nonZero.length >= 3) {
    if (unique === 1) hint = "声调偏平";
    else if (unique === nonZero.length) hint = "声调有起伏";
  }
  return {
    py: sInfo ? sInfo.py + " " + n.py : n.py,
    toneText: tones.join("-"),
    hint
  };
}

function total(n) {
  return n.sc.reduce((sum, v) => sum + v, 0);
}

    (!recOnly || n.rec) &&
    (!fitOnly || fitRank[nameFit(n)] <= 2) &&
    [...blockedChars].every(ch => !n.n.includes(ch))
  ));
  if (sortMode === "fit") {
    list = list.slice().sort((a, b) => fitRank[nameFit(a)] - fitRank[nameFit(b)] || total(b) - total(a));
  } else if (sortMode === "yin") {
    list = list.slice().sort((a, b) => b.sc[0] - a.sc[0]);
  } else if (sortMode === "su") {
    list = list.slice().sort((a, b) => b.sc[4] - a.sc[4]);
  } else {
    list = list.slice().sort((a, b) => total(b) - total(a));
  }
  return list;
}

function cardHTML(n, surname) {
  const full = surname ? surname + n.n : n.n;
  const meta = fullNameMeta(surname, n);
  const pyLine = meta ? meta.py : n.py;
  const toneLine = meta
    ? "声调 " + meta.toneText + (meta.hint ? " · " + meta.hint : "")
    : (surname ? "姓氏拼音待补" : "");
  const d = DETAILS[n.n] || { fit: n.fit || "中", text: n.fitText || "以音义与出处为据；如需强补喜用，优先水象候选。" };
  const fitClass = d.fit === "高" ? "fit-high" : (d.fit === "慎" ? "fit-low" : "fit-mid");
  const bars = SCORE_NAMES.map((label, i) =>
    `<div class="score"><span>${label}</span><div class="bar"><div class="fill" style="width:${n.sc[i] * 20}%"></div></div><span>${n.sc[i]}</span></div>`
  ).join("");
  const tags = n.tags.map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const active = picked.has(n.n);
  return `<article class="card">
    <div class="card-head">
      <div>
        <div class="name">${esc(full)}</div>
        <div class="pinyin">${esc(pyLine)}${toneLine ? `<div class="tone">${esc(toneLine)}</div>` : ""}</div>
      </div>
      <span class="badge">${esc(n.g)}</span>
    </div>
    <div class="tags">${tags}</div>
    <div class="origin">${esc(n.src)}</div>
    <div class="scores">${bars}</div>
    <div class="note">${esc(n.note)}</div>
    <div class="actions">
      <button type="button" class="detail-toggle" data-detail="${esc(n.n)}" aria-expanded="false">查看依据</button>
      <button type="button" class="${active ? "is-picked" : ""}" aria-pressed="${active}" data-name="${esc(n.n)}">${active ? "已选" : "候选"}</button>
    </div>
    <div class="detail" hidden>
      <div class="fit-row"><span class="fit-badge ${fitClass}">契合 ${d.fit}</span></div>
      <p><strong>八字契合</strong>：${esc(d.text)}</p>
      <p><strong>取名依据</strong>：${esc(n.src)}。${esc(n.note)}</p>
    </div>
  </article>`;
}

function renderPicks(surname) {
  const items = NAMES.filter(n => picked.has(n.n));
  els.pickedCount.textContent = items.length;
  els.pickedList.innerHTML = items.length
    ? items.map(n => {
        const full = surname ? surname + n.n : n.n;
        return `<span class="pick-chip"><span>${esc(full)} · ${total(n)} 分</span><button type="button" data-name="${esc(n.n)}" aria-label="移除${esc(full)}">移除</button></span>`;
      }).join("")
    : '<div class="empty">尚未选择</div>';
}

function renderCompare(surname) {
  const items = NAMES.filter(n => picked.has(n.n));
  els.compareBox.hidden = items.length === 0;
  if (!items.length) return;
  els.compareTableBody.innerHTML = items.map(n => {
    const full = surname ? surname + n.n : n.n;
    const meta = fullNameMeta(surname, n);
    const tone = meta ? meta.toneText : (surname ? "待补" : "");
    const scores = SCORE_NAMES.map((label, i) => `<span class="num">${label}${n.sc[i]}</span>`).join(" ");
    return `<tr>
      <td><strong>${esc(full)}</strong><div class="pinyin">${esc(meta ? meta.py : n.py)}</div></td>
      <td>${esc(n.src)}</td>
      <td class="num">${esc(tone)}</td>
      <td>${scores}</td>
      <td>${esc(n.note)}</td>
    </tr>`;
  }).join("");
}

function diagnoseCustom() {
  const input = els.customName.value.trim();
  const box = els.customResult;
  if (!input) {
    box.innerHTML = '<div class="empty">输入名字后显示诊断</div>';
    return;
  }
  const surname = els.surname.value.trim() || "皇甫";
  const full = surname + input;
  const chars = [...input];
  const counts = { 水: 0, 金: 0, 木: 0, 火: 0, 土: 0, 玉: 0, 中性: 0 };
  chars.forEach(ch => { counts[charElement(ch)] += 1; });
  const hasFire = counts.火 > 0;
  const hasEarth = counts.土 > 0;
  const hasWater = counts.水 > 0;
  const hasGold = counts.金 > 0;
  const hasWood = counts.木 > 0;
  let level = "中";
  let reason = "字面五行中性，以音义为主；如需强补喜用，建议加入水象字。";
  if (hasFire || hasEarth) {
    if (hasWater && counts.火 + counts.土 <= 1) {
      level = "中高";
      reason = "含火/土字但配了水字，燥气可润；建议只保留一个火土字，不要再加。";
    } else {
      level = "慎";
      reason = "火/土字偏重，与本命喜金水、忌火土相逆；建议避开或换成清、沁、澄等水象字。";
    }
  } else if (hasWater) {
    level = "高";
    reason = "含水象字，正合己土喜水润局；" + (hasGold || counts.玉 > 0 ? "又有金/玉意象，金水相生，更佳。" : "若再合金象字会更稳。");
  } else if (hasGold) {
    level = "中高";
    reason = "合金象字，金为次喜，可生水助身；建议搭配水象字更佳。";
  } else if (hasWood) {
    level = "中";
    reason = "木字可疏土但会生火，本命木须水配；单用木字契合一般。";
  }
  const notes = [];
  if ([..."霄文静皇甫祖"].some(ch => input.includes(ch))) {
    notes.push("包含父母名讳或姓氏用字，建议避开。");
  }
  const unknown = chars.filter(ch => !KNOWN_CHARS.has(ch));
  if (unknown.length) {
    notes.push(`暂未收录：${unknown.join("、")}。请用《通用规范汉字表》核对字形。`);
  }
  notes.push("字面五行按偏旁与常用字义推断，仅供家庭参考，不替代完整命理复核。");
  const fitClass = level === "高" ? "fit-high" : (level === "慎" ? "fit-low" : "fit-mid");
  const elText = chars.map(ch => `${ch}：${charElement(ch)}`).join("、");
  box.innerHTML = `
    <div class="fit-row"><span class="fit-badge ${fitClass}">契合 ${level}</span></div>
    <p class="diag-line"><strong>全名</strong>：${esc(full)}</p>
    <p class="diag-line"><strong>单字五行</strong>：${esc(elText)}</p>
    <p class="diag-line"><strong>八字判断</strong>：${esc(reason)}</p>
    ${notes.map(n => `<p class="diag-line"><strong>提示</strong>：${esc(n)}</p>`).join("")}
  `;
}

async function saveSharedState(picksOverride) {
  if (location.protocol !== "http:" && location.protocol !== "https:") return;
  const picks = picksOverride || [...picked];
  try {
    await fetch("/api/state", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ picks })
    });
  } catch (err) {
    // 非共享环境（如直接打开本地文件）时静默降级
  }
}

async function loadSharedState(silent) {
  if (location.protocol !== "http:" && location.protocol !== "https:") return;
  try {
    const res = await fetch("/api/state", { cache: "no-store" });
    if (!res.ok) return;
    const state = await res.json();
    let remote = new Set(state.picks || []);
    let local = new Set();
    try {
      local = new Set(JSON.parse(localStorage.getItem("baby-name-picks") || "[]"));
    } catch (err) {
      local = new Set();
    }
    if (!state.updatedAt && local.size) {
      remote = new Set([...remote, ...local]);
      saveSharedState([...remote]);
    }
    const key = [...remote].sort().join("|");
    if (key !== [...picked].sort().join("|")) {
      picked = remote;
      localStorage.setItem("baby-name-picks", JSON.stringify([...picked]));
      if (!silent) render();
    }
  } catch (err) {
    // 共享服务不可用时保留本地数据
  }
}

function render() {
  const surname = els.surname.value.trim();
  const list = filtered();
  els.count.textContent = list.length;
  els.fullnameText.textContent = surname || "—";
  const sInfo = surnameInfo(surname);
  els.fullnameMeta.textContent = surname
    ? (sInfo ? sInfo.py + " · 声调 " + tonesFor(sInfo.py).join("-") : "姓氏拼音待补")
    : "—";
  els.grid.innerHTML = list.length
    ? list.map(n => cardHTML(n, surname)).join("")
    : '<div class="empty">没有符合条件的结果</div>';
  renderPicks(surname);
  renderCompare(surname);
}

function togglePick(name) {
  if (picked.has(name)) {
    picked.delete(name);
  } else {
    picked.add(name);
  }
  localStorage.setItem("baby-name-picks", JSON.stringify([...picked]));
  saveSharedState();
  render();
}

function onClick(e) {
  const detailBtn = e.target.closest("button[data-detail]");
  if (detailBtn) {
    const card = detailBtn.closest(".card");
    const detail = card ? card.querySelector(".detail") : null;
    if (!detail) return;
    const expanded = detailBtn.getAttribute("aria-expanded") === "true";
    detail.hidden = expanded;
    detailBtn.setAttribute("aria-expanded", String(!expanded));
    detailBtn.textContent = expanded ? "查看依据" : "收起依据";
    return;
  }
  const btn = e.target.closest("button[data-name]");
  if (btn) togglePick(btn.dataset.name);
}

function fallbackCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand("copy");
  } catch (err) {
    // 无操作权限时保持页面可用
  }
  ta.remove();
}

function copyCompareText() {
  const surname = els.surname.value.trim();
  const items = NAMES.filter(n => picked.has(n.n));
  if (!items.length) return false;
  const lines = items.map(n => {
    const full = surname ? surname + n.n : n.n;
    const meta = fullNameMeta(surname, n);
    return full + " " + (meta ? meta.py : n.py) + "｜" + total(n) + "分｜" + n.src + "｜" + n.note;
  });
  const text = "候选对比\n" + lines.join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  } else {
    fallbackCopy(text);
  }
  return true;
}

["gender", "style", "sort"].forEach(id => $(id).addEventListener("change", render));
els.folk.addEventListener("change", render);
els.rec.addEventListener("change", render);
els.fitOnly.addEventListener("change", render);
els.surname.addEventListener("input", render);
els.blocked.addEventListener("input", render);
els.customName.addEventListener("input", diagnoseCustom);
els.grid.addEventListener("click", onClick);
els.pickedList.addEventListener("click", onClick);
els.copyCompare.addEventListener("click", () => {
  const ok = copyCompareText();
  if (!ok) return;
  const old = els.copyCompare.textContent;
  els.copyCompare.textContent = "已复制";
  setTimeout(() => {
    els.copyCompare.textContent = old;
  }, 1200);
});

render();
loadSharedState(false);
setInterval(() => loadSharedState(true), 5000);
</script>
</body>
</html>
